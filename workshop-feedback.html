<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作坊體驗回饋｜OH Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Noto Sans TC','sans-serif'] }, colors: {
        oat:'#FAF8F5', linen:'#F4EFEA', sand:'#E6DDD4', wood:'#7E6E5F', moss:'#707F6C', pale:'#F3F5F2'
      }}}
    };
  </script>
  <style>
    body{background:#FAF8F5;font-family:'Noto Sans TC',sans-serif;background-image:radial-gradient(at 15% 20%,rgba(244,239,234,.75),transparent 50%),radial-gradient(at 85% 80%,rgba(226,230,223,.7),transparent 50%)}
    .card{background:rgba(255,255,255,.94);border:1px solid #E6DDD4;box-shadow:0 12px 36px rgba(126,110,95,.08)}
    .opt input:checked + span{background:#F3F5F2;border-color:#707F6C;color:#586555;font-weight:500}
  </style>
</head>
<body class="min-h-screen text-stone-700">
  <main class="max-w-2xl mx-auto px-4 py-8 md:py-12">
    <div class="card rounded-[30px] overflow-hidden">
      <div class="px-7 md:px-10 pt-8">
        <div class="h-2 bg-linen rounded-full overflow-hidden"><div id="bar" class="h-full bg-moss rounded-full transition-all duration-300" style="width:0%"></div></div>
      </div>
      <div class="px-7 md:px-10 py-8">
        <section id="welcome" class="space-y-6">
          <div>
            <span class="inline-block px-4 py-1.5 rounded-full bg-pale text-moss text-xs border border-sand">工作坊體驗回饋</span>
            <h1 id="workshopTitle" class="text-2xl md:text-3xl font-bold text-stone-800 mt-4">工作坊回饋</h1>
            
          </div>
          <div id="extraInfoBlock" class="rounded-3xl bg-oat border border-sand p-5 text-sm leading-relaxed hidden">
            <p id="extraInfoTitle" class="font-medium text-stone-800"></p>
            <p id="extraInfoContent" class="mt-2 text-stone-500 whitespace-pre-line"></p>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-2">怎麼稱呼你？ <span class="font-normal text-stone-400">（選填）</span></label>
            <input id="name" class="w-full px-5 py-3.5 rounded-2xl border border-sand bg-white focus:outline-none focus:ring-4 focus:ring-linen" placeholder="暱稱即可" />
          </div>
          <button onclick="start()" class="w-full md:w-auto px-8 py-3.5 rounded-full bg-wood text-white hover:opacity-90">開始填寫</button>
        </section>

        <section id="questionArea" class="hidden">
          <div class="flex justify-between items-center pb-4 border-b border-sand">
            <span id="counter" class="text-xs text-stone-400 font-medium"></span>
            <button onclick="restart()" class="text-xs text-stone-400">重新開始</button>
          </div>
          <div id="question" class="py-7 min-h-[320px]"></div>
          <div class="flex justify-between gap-3 pt-5 border-t border-sand">
            <button id="prev" onclick="prev()" class="px-5 py-3 rounded-full border border-sand bg-white text-sm">上一題</button>
            <button onclick="next()" class="px-7 py-3 rounded-full bg-wood text-white text-sm"><span id="nextText">下一題</span></button>
          </div>
        </section>

        <section id="thanks" class="hidden text-center py-10 space-y-5">
          <div class="w-16 h-16 rounded-full bg-pale text-moss flex items-center justify-center mx-auto text-2xl">✓</div>
          <h2 class="text-xl font-bold text-stone-800">收到啦，謝謝你 🌿</h2>
          <p class="text-sm text-stone-500 leading-relaxed max-w-md mx-auto">你的回饋會幫助我調整下一次的節奏、玩法和隱藏題目。也希望剛才那個「欸？好像有點像我」的瞬間，能陪你多走一小段。</p>
        </section>
      </div>
    </div>
  </main>

<script>
// 部署 Google Apps Script 後，把這裡換成 Web App URL
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwS7sCZSEpRbhIVRy98yjupE0fbxLE_eSY7vK5RjuUUmbwYXgy9fpg9i_C6EyghbBsx/exec';
const p = new URLSearchParams(location.search);
const params = new URLSearchParams(location.search);
const eventId = (params.get('event') || 'WS002').toUpperCase();
let eventName = params.get('name') || '';
let configLoaded = false;

let questions = [
  {
    id:'q1',
    type:'checkbox',
    title:'參加完今天的活動，你的整體感覺比較接近？',
    hint:'可複選，選最像你的就好。',
    options:['😂 好玩／有趣','🌱 有收穫','💡 有被啟發','👀 對自己有新的發現','🫧 覺得比較放鬆','🌙 有些東西還在消化','😐 沒有特別感覺'],
    other:true
  },
  {
    id:'q2',
    type:'checkbox',
    title:'哪個環節讓你最有感／印象最深？',
    hint:'可複選。',
    options:[],
    other:true
  },
  {
    id:'q3',
    type:'text',
    title:'回頭看看今天的活動，你對自己有什麼新的發現或感受？',
    hint:'一句話、一個感覺都可以。',
    placeholder:'寫下你此刻最有感的發現…'
  },
  {
    id:'q4',
    type:'radio',
    title:'如果之後還有不同主題的工作坊，你會想再參加嗎？',
    options:['🙋 會，我想再參加','👯 會，而且可以揪朋友','👀 看主題，有興趣會來','🤔 看時間／地點','😌 暫時不會'],
    required:true
  },
  {
    id:'q5',
    type:'radio_feedback',
    title:'如果你的回饋很有趣，我可以匿名分享嗎？',
    hint:'只會分享回饋內容，不會公開你的姓名。',
    options:['可以匿名引用','可以分享，但請不要完整引用','暫時不希望公開分享'],
    required:true
  }
];

async function loadWorkshopConfig(){
  try{
    const url = `${GAS_URL}?action=workshopConfig&event=${encodeURIComponent(eventId)}`;
    const res = await fetch(url);
    const data = await res.json();

    if(!data || data.result !== 'success'){
      throw new Error(data?.error || '讀取活動設定失敗');
    }

    eventName = data.eventName || eventName || eventId;

    const title = data.formTitle || eventName || '工作坊回饋';

    document.title = `${title}｜工作坊回饋`;
    const workshopTitleEl = document.getElementById('workshopTitle');
    if(workshopTitleEl) workshopTitleEl.textContent = title;

    const extraBlock = document.getElementById('extraInfoBlock');
    const extraTitleEl = document.getElementById('extraInfoTitle');
    const extraContentEl = document.getElementById('extraInfoContent');

    const extraTitle = (data.extraTitle || data.formIntro || '').trim();

    let extraContent = (data.extraContent || data.hiddenTopic || '').trim();
    const legacyReveal = (data.revealGuide || '').trim();
    if(legacyReveal && !extraContent.includes(legacyReveal)){
      extraContent = extraContent
        ? `${extraContent}\n\n${legacyReveal}`
        : legacyReveal;
    }

    if(extraTitle || extraContent){
      if(extraTitleEl){
        extraTitleEl.textContent = extraTitle;
        extraTitleEl.classList.toggle('hidden', !extraTitle);
      }
      if(extraContentEl){
        extraContentEl.textContent = extraContent;
        extraContentEl.classList.toggle('hidden', !extraContent);
      }
      if(extraBlock) extraBlock.classList.remove('hidden');
    }else{
      if(extraBlock) extraBlock.classList.add('hidden');
    }

    // 更新畫面上的活動名稱（若頁面上有對應元素）
    const titleEl = document.getElementById('eventName');
    if(titleEl) titleEl.textContent = eventName;

    // Q2：用「｜」分隔
    if(data.q2Options){
      questions[1].options = data.q2Options
        .split('｜')
        .map(x => x.trim())
        .filter(Boolean);
    }

    // Q3：每場主題題目
    if(data.q3Question){
      questions[2].title = data.q3Question;
    }

    configLoaded = true;
    return true;
  }catch(err){
    console.warn('讀取工作坊設定失敗：', err);
    if(!eventName) eventName = eventId;
    configLoaded = false;
    return false;
  }
}

let step=-1; const form={name:'',answers:{},feedback:''};

document.addEventListener('DOMContentLoaded', async () => {
  await loadWorkshopConfig();
});


async function start(){
  const ok = await loadWorkshopConfig();
  if(!ok){
    alert('目前無法讀取這場工作坊的題目設定，請稍後再試或聯絡帶領者。');
    return;
  }
  form.name=document.getElementById('name').value.trim()||'匿名';
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('questionArea').classList.remove('hidden');
  step=0;
  render();
}
function restart(){step=-1;form.name='';form.answers={};form.feedback='';document.getElementById('name').value='';document.getElementById('questionArea').classList.add('hidden');document.getElementById('thanks').classList.add('hidden');document.getElementById('welcome').classList.remove('hidden');updateBar();}
function updateBar(){document.getElementById('bar').style.width=step<0?'0%':`${Math.min(100,Math.round((step+1)/questions.length*100))}%`;}
function render(){
  const q=questions[step], saved=form.answers[q.id]||{};
  document.getElementById('counter').textContent=`問題 ${step+1} / ${questions.length}`;
  document.getElementById('prev').classList.toggle('invisible',step===0);
  document.getElementById('nextText').textContent=step===questions.length-1?'提交回饋':'下一題';

  let html=`<h3 class="text-lg font-bold text-stone-800 leading-relaxed">${q.title}${q.required?'<span class="ml-2 text-[10px] px-2 py-1 rounded-full bg-pale text-moss">必填</span>':''}</h3>${q.hint?`<p class="text-xs text-stone-400 mt-2">${q.hint}</p>`:''}<div class="mt-5 space-y-2.5">`;

  if(q.type==='checkbox'||q.type==='radio'||q.type==='radio_feedback'){
    q.options.forEach((o)=>{
      const checked=q.type==='checkbox'?(saved.values||[]).includes(o):saved.value===o;
      html+=`<label class="opt block cursor-pointer"><input class="sr-only" type="${q.type==='checkbox'?'checkbox':'radio'}" name="${q.id}" value="${o}" ${checked?'checked':''}><span class="block px-4 py-3.5 rounded-2xl border border-sand bg-white hover:bg-oat">${o}</span></label>`;
    });

    if(q.other){
      const other=saved.other||'';
      html+=`<input id="${q.id}_other" value="${other}" class="w-full px-4 py-3 rounded-2xl border border-sand mt-2" placeholder="其他：請寫下你的感覺">`;
    }

    if(q.type==='radio_feedback'){
      html+=`
        <div class="mt-7 pt-6 border-t border-sand">
          <h4 class="text-base font-bold text-stone-800">最後，有沒有什麼想跟我說的？</h4>
          <p class="text-xs text-stone-400 mt-2">活動建議、覺得可以改善的地方、今天的心得或任何回饋，都可以留在這裡。（選填）</p>
          <textarea id="feedback_text" rows="5" class="w-full mt-4 px-4 py-3 rounded-2xl border border-sand bg-white leading-relaxed" placeholder="建議、改善、心得與回饋…">${form.feedback||''}</textarea>
        </div>`;
    }
  } else if(q.type==='text'){
    html+=`<textarea id="${q.id}_text" rows="5" class="w-full px-4 py-3 rounded-2xl border border-sand bg-white leading-relaxed" placeholder="${q.placeholder||''}">${saved.value||''}</textarea>`;
  }

  html+='</div>';
  document.getElementById('question').innerHTML=html;
  updateBar();
}

function save(){
  const q=questions[step];
  if(q.type==='checkbox'){
    const values=[...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(x=>x.value);
    const other=document.getElementById(`${q.id}_other`)?.value.trim()||'';
    form.answers[q.id]={values,other};
  } else if(q.type==='radio'||q.type==='radio_feedback'){
    form.answers[q.id]={value:document.querySelector(`input[name="${q.id}"]:checked`)?.value||''};
    if(q.type==='radio_feedback'){
      form.feedback=document.getElementById('feedback_text')?.value.trim()||'';
    }
  } else {
    form.answers[q.id]={value:document.getElementById(`${q.id}_text`).value.trim()};
  }
}

function valid(){
  const q=questions[step];
  if(!q.required)return true;
  if(q.type==='radio'||q.type==='radio_feedback'){
    if(!document.querySelector(`input[name="${q.id}"]:checked`)){
      alert('這題是必填喔～');
      return false;
    }
  }
  return true;
}

function prev(){save();if(step>0){step--;render();}}
function next(){if(!valid())return;save();if(step<questions.length-1){step++;render();}else submit();}
function flatCheckbox(a){if(!a)return'';return [...(a.values||[]), ...(a.other?[`其他：${a.other}`]:[])].join('｜');}

async function submit(){
  const a=form.answers;
  const payload={
    type:'workshop',
    timestamp:new Date().toISOString(),
    eventId,
    eventName,
    name:form.name,
    q1:flatCheckbox(a.q1),
    q2:flatCheckbox(a.q2),
    q3:a.q3?.value||'',
    q4:a.q4?.value||'',
    q5:a.q5?.value||'',
    feedback:form.feedback||''
  };

  document.getElementById('questionArea').classList.add('hidden');
  document.getElementById('thanks').classList.remove('hidden');
  step=questions.length;
  updateBar();

  if(GAS_URL.includes('PASTE_YOUR')){
    console.warn('尚未設定 GAS_URL',payload);
    return;
  }
  try{
    await fetch(GAS_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
  }catch(e){
    console.error(e);
  }
}
</script>
</body>
</html>
